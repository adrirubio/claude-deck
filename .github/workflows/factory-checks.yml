name: Factory source checks

on:
  pull_request:
    branches: [master, feature/software-delivery-product-reposition]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: factory-source-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    name: Changed Python undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.10
      - name: Check changed Python files
        env:
          ACCEPTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          CHECK_SCRIPT=scripts/factory-static-check.py
          if ! test -f "$CHECK_SCRIPT"; then
            CHECK_SCRIPT="$RUNNER_TEMP/factory-static-check.py"
            git show "$ACCEPTED_BASE:scripts/factory-static-check.py" > "$CHECK_SCRIPT"
          fi
          python "$CHECK_SCRIPT" --base "$ACCEPTED_BASE"
