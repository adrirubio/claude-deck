name: Product CI

on:
  pull_request:
    branches: [master, feature/software-delivery-product-reposition, release/v3.0.0, release/v3.1]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, feature/software-delivery-product-reposition, release/v3.0.0, release/v3.1]

permissions:
  contents: read
  pull-requests: read  # the docs-only detector lists the changed files

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Product frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/docs_only.py
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.run_suites != 'false'
      - run: npm run check:dark-pairs
        if: steps.changes.outputs.run_suites != 'false'
      - run: npm test
        if: steps.changes.outputs.run_suites != 'false'
      - run: npm run build
        if: steps.changes.outputs.run_suites != 'false'

  gate:
    name: Product CI gate
    if: always()
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require the frontend result
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$FRONTEND_RESULT" = success
