name: Product CI

on:
  pull_request:
    branches: [feature/software-delivery-product-reposition]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [feature/software-delivery-product-reposition]

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Product backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt apscheduler
      - name: Configure identity for disposable Git fixtures
        run: |
          git config --global user.name 'Product CI'
          git config --global user.email 'product-ci@users.noreply.github.com'
      - name: Run isolated factory regressions
        run: python -m pytest backend/tests/agent_teams backend/tests/factory backend/tests/test_sqlite_compat_migrations.py -q --tb=short --disable-warnings

  frontend:
    name: Product frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  gate:
    name: Product CI gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require both job results
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
