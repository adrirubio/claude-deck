name: Backend regression tests

on:
  pull_request:
    branches: [master, feature/software-delivery-product-reposition]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, feature/software-delivery-product-reposition]

permissions:
  contents: read

concurrency:
  group: backend-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Full backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt apscheduler
      - name: Configure disposable Git fixtures
        run: |
          git config --global user.name 'Factory CI'
          git config --global user.email 'factory-ci@users.noreply.github.com'
      - name: Run the full backend suite
        run: python -m pytest backend/tests -q --tb=short --disable-warnings
