<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<defs><symbol id="i-human" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="4.6"/><path d="M2.5 23c0-5.6 4.3-9.4 9.5-9.4s9.5 3.8 9.5 9.4z"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="11" y="1.5" width="2" height="4"/><circle cx="12" cy="2" r="2"/><rect x="2.5" y="5.5" width="19" height="15.5" rx="4.5"/><circle cx="8.5" cy="12.5" r="2.1" fill="#fff"/><circle cx="15.5" cy="12.5" r="2.1" fill="#fff"/><rect x="8" y="16.6" width="8" height="1.7" rx=".8" fill="#fff"/><rect x="0" y="10" width="2" height="5" rx="1"/><rect x="22" y="10" width="2" height="5" rx="1"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3.4 3.35"/><circle cx="12" cy="12" r="6.6"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></symbol>
  </defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>

  <use href="#i-system" x="62" y="8" width="20" height="20" fill="#334155" color="#334155"/>
  <text x="88" y="24" font-size="15" font-weight="700" fill="#1e293b">Controller derives the status (non-agent)</text>
  <text x="240" y="46" text-anchor="middle" font-size="12" fill="#57534e">It compares the clock with the last promise.</text>
  <line x1="30" y1="150" x2="455" y2="150" stroke="#44403c" stroke-width="2"/>
  <rect x="60" y="100" width="170" height="40" fill="#dcfce7" stroke="#15803d"/>
  <text x="145" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Healthy</text>
  <rect x="230" y="100" width="110" height="40" fill="#fef9c3" stroke="#a16207"/>
  <text x="285" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Late</text>
  <rect x="340" y="100" width="115" height="40" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="397" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Absent</text>
  <line x1="60" y1="142" x2="60" y2="162" stroke="#6d28d9" stroke-width="3"/>
  <text x="60" y="180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">check-in</text>
  <line x1="230" y1="142" x2="230" y2="162" stroke="#44403c" stroke-width="2"/>
  <text x="230" y="180" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace">next_check_at</text>
  <line x1="340" y1="142" x2="340" y2="162" stroke="#44403c" stroke-width="2"/>
  <text x="340" y="180" text-anchor="middle" font-size="11">threshold (open)</text>
  <text x="455" y="168" text-anchor="end" font-size="11" fill="#78716c">time →</text>
  <text x="30" y="218" font-size="12.5"><tspan font-weight="700">None</tspan> — no supervisor registered. Not an error.</text>
  <text x="30" y="240" font-size="12.5"><tspan font-weight="700">Healthy</tspan> — the promised check has not passed.</text>
  <text x="30" y="262" font-size="12.5"><tspan font-weight="700">Late</tspan> — the check is overdue. Work can still run.</text>
  <text x="30" y="284" font-size="12.5"><tspan font-weight="700">Absent</tspan> — no check-in, or long overdue.</text>
  <text x="30" y="316" font-size="12">“Supervisor overdue” becomes an attention signal.</text>
  <text x="30" y="340" font-size="11.5" fill="#78716c">Replaces playbook §5 “record its last tick … state that supervision stopped”.</text>
</svg>
