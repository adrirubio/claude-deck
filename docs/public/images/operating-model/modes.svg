<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452">
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<defs><symbol id="i-human" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="4.6"/><path d="M2.5 23c0-5.6 4.3-9.4 9.5-9.4s9.5 3.8 9.5 9.4z"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="11" y="1.5" width="2" height="4"/><circle cx="12" cy="2" r="2"/><rect x="2.5" y="5.5" width="19" height="15.5" rx="4.5"/><circle cx="8.5" cy="12.5" r="2.1" fill="#fff"/><circle cx="15.5" cy="12.5" r="2.1" fill="#fff"/><rect x="8" y="16.6" width="8" height="1.7" rx=".8" fill="#fff"/><rect x="0" y="10" width="2" height="5" rx="1"/><rect x="22" y="10" width="2" height="5" rx="1"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3.4 3.35"/><circle cx="12" cy="12" r="6.6"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></symbol>
  </defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>

  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker></defs>

  <text x="20" y="28" font-size="15" font-weight="700">A · Normal running</text>
  <text x="186" y="28" font-size="12.5" fill="#57534e">Deck UI available · supervisor optional</text>

  <!-- A1 team (agent) -->
  <rect x="20" y="44" width="200" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="30" y="54" width="20" height="20" fill="#6d28d9"/>
  <text x="56" y="70" font-size="13.5" font-weight="700" fill="#4c1d95">Team works</text>
  <text x="32" y="94" font-size="11" font-weight="700" fill="#6d28d9">TEAM · AI AGENTS</text>
  <text x="32" y="112" font-size="11.5" fill="#4c1d95">dispatch · Mail · PRs · CI</text>
  <!-- A2 deck (system) -->
  <rect x="265" y="44" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <use href="#i-system" x="275" y="54" width="20" height="20" fill="#334155" color="#334155"/>
  <text x="301" y="70" font-size="13.5" font-weight="700" fill="#1e293b">Deck flags it</text>
    <text x="277" y="94" font-size="11" font-weight="700" fill="#334155">CONTROLLER · NON-AGENT</text>
  <text x="277" y="112" font-size="11.5" fill="#1e293b">existing signals, now on one card</text>
  <!-- A3 leader (agent) -->
  <rect x="520" y="44" width="215" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="530" y="54" width="20" height="20" fill="#6d28d9"/>
  <text x="556" y="70" font-size="13.5" font-weight="700" fill="#4c1d95">Leader acts</text>
  <text x="532" y="94" font-size="11" font-weight="700" fill="#6d28d9">LEADER · AI AGENT</text>
  <text x="532" y="112" font-size="11.5" fill="#4c1d95">backlog, plans, next work</text>
  <!-- A4 Director (human) -->
  <rect x="780" y="44" width="200" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <use href="#i-human" x="790" y="54" width="20" height="20" fill="#b45309"/>
  <text x="816" y="70" font-size="13.5" font-weight="700" fill="#78350f">Director decides</text>
  <text x="792" y="94" font-size="11" font-weight="700" fill="#b45309">DIRECTOR · HUMAN</text>
  <text x="792" y="112" font-size="11.5" fill="#78350f">retained decisions only</text>
  <path d="M220,84 L261,84" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M475,84 L516,84" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M735,84 L776,84" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="265" y="136" width="470" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 3"/>
  <use href="#i-agent" x="274" y="142" width="18" height="18" fill="#6d28d9"/>
  <text x="298" y="156" font-size="12" fill="#4c1d95">Optional supervisor (AI agent): reads the same signals, fixes routine blockers</text>

  <line x1="20" y1="192" x2="980" y2="192" stroke="#d6d3d1" stroke-width="1.5"/>
  <use href="#i-human" x="20" y="172" width="14" height="14" fill="#b45309"/>
  <text x="38" y="183" font-size="11.5" fill="#78350f">The Director grooms the backlog at any time. The dispatch label is the Director’s “ready” signal.</text>
  <text x="500" y="207" text-anchor="middle" font-size="11.5" fill="#78716c">a defect in Deck itself blocks the work ↓</text>

  <text x="20" y="236" font-size="15" font-weight="700">B · Factory maintenance</text>
  <text x="236" y="236" font-size="12.5" fill="#57534e">supervisor required · the controller is down for a short period</text>

  <g>
  <rect x="20" y="252" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="30" y="262" width="20" height="20" fill="#6d28d9"/>
  <text x="56" y="278" font-size="13.5" font-weight="700" fill="#4c1d95">Prepare the fix</text>
  <text x="32" y="302" font-size="11" font-weight="700" fill="#6d28d9">SUPERVISOR · AGENT</text>
  <text x="32" y="320" font-size="11.5" fill="#4c1d95">isolated, reviewed</text>

  <rect x="215" y="252" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="225" y="262" width="20" height="20" fill="#6d28d9"/>
  <text x="251" y="278" font-size="13.5" font-weight="700" fill="#4c1d95">Safe handoff</text>
  <text x="227" y="302" font-size="11" font-weight="700" fill="#6d28d9">TEAM OWNERS · AGENTS</text>
  <text x="227" y="320" font-size="11.5" fill="#4c1d95">checkpoint, then hold</text>

  <rect x="410" y="252" width="190" height="80" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <use href="#i-system" x="420" y="262" width="20" height="20" fill="#334155" color="#334155"/>
  <text x="446" y="278" font-size="13.5" font-weight="700" fill="#1e293b">Run the upgrade</text>
  <text x="422" y="302" font-size="11" font-weight="700" fill="#334155">MAINTENANCE SCRIPT</text>
  <text x="422" y="320" font-size="11.5" fill="#1e293b">stop · backup · deploy · start</text>

  <rect x="625" y="252" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="635" y="262" width="20" height="20" fill="#6d28d9"/>
  <text x="661" y="278" font-size="13.5" font-weight="700" fill="#4c1d95">Check state</text>
  <text x="637" y="302" font-size="11" font-weight="700" fill="#6d28d9">SUPERVISOR · AGENT</text>
  <text x="637" y="320" font-size="11.5" fill="#4c1d95">DB, leases, authority</text>

  <rect x="820" y="252" width="160" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <use href="#i-agent" x="830" y="262" width="20" height="20" fill="#6d28d9"/>
  <text x="856" y="278" font-size="13.5" font-weight="700" fill="#4c1d95">Resume</text>
  <text x="832" y="302" font-size="11" font-weight="700" fill="#6d28d9">SUPERVISOR · AGENT</text>
  <text x="832" y="320" font-size="11.5" fill="#4c1d95">back to mode A</text>
  </g>
  <path d="M190,292 L211,292" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M385,292 L406,292" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M600,292 L621,292" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M795,292 L816,292" stroke="#57534e" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="20" y="350" width="960" height="40" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <use href="#i-system" x="32" y="360" width="20" height="20" fill="#334155" color="#334155"/>
  <text x="510" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GitHub (outside the factory) keeps running: the parent issue is the only live status surface while the controller is down.</text>
  <use href="#i-human" x="300" y="402" width="16" height="16" fill="#b45309"/>
  <text x="322" y="415" font-size="11.5" fill="#78350f">The Director acts in maintenance only for a genuine security HOLD.</text>
  <text x="500" y="442" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Team sessions keep running through the restart; the upgrade is refused if a session changes. Resume re-enables autonomy; it relaunches no agent.</text>
</svg>
