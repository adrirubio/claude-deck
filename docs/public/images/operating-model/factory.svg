<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<defs><symbol id="i-human" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="4.6"/><path d="M2.5 23c0-5.6 4.3-9.4 9.5-9.4s9.5 3.8 9.5 9.4z"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="11" y="1.5" width="2" height="4"/><circle cx="12" cy="2" r="2"/><rect x="2.5" y="5.5" width="19" height="15.5" rx="4.5"/><circle cx="8.5" cy="12.5" r="2.1" fill="#fff"/><circle cx="15.5" cy="12.5" r="2.1" fill="#fff"/><rect x="8" y="16.6" width="8" height="1.7" rx=".8" fill="#fff"/><rect x="0" y="10" width="2" height="5" rx="1"/><rect x="22" y="10" width="2" height="5" rx="1"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3.4 3.35"/><circle cx="12" cy="12" r="6.6"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></symbol>
  </defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>

  <defs>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>

  <!-- factory boundary -->
  <rect x="15" y="100" width="760" height="460" rx="16" fill="#fafaf9" stroke="#1c1917" stroke-width="2.5" stroke-dasharray="11 6"/>
  <rect x="622" y="88" width="138" height="24" rx="5" fill="#1c1917"/>
  <text x="691" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" letter-spacing="1">THE FACTORY</text>
  <text x="760" y="132" text-anchor="end" font-size="12" font-weight="600" fill="#1c1917">= supervisor + controller + team</text>

  <!-- Director (human) -->
  <rect x="350" y="12" width="300" height="62" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <use href="#i-human" x="364" y="22" width="26" height="26" fill="#b45309"/>
  <text x="500" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Director</text>
  <text x="500" y="60" text-anchor="middle" font-size="12.5" fill="#78350f">HUMAN · sets the outcome · decides</text>

  <!-- Supervisor (agent) -->
  <rect x="30" y="180" width="170" height="190" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 4"/>
  <use href="#i-agent" x="40" y="190" width="24" height="24" fill="#6d28d9"/>
  <text x="70" y="208" font-size="15.5" font-weight="700" fill="#4c1d95">Supervisor</text>
  <text x="42" y="232" font-size="10.5" font-weight="700" fill="#6d28d9" letter-spacing=".5">AI AGENT · OPTIONAL</text>
  <text x="42" y="254" font-size="11.5" fill="#4c1d95">Claude Code, OpenClaw,</text>
  <text x="42" y="270" font-size="11.5" fill="#4c1d95">or the Director</text>
  <text x="42" y="294" font-size="11.5" fill="#4c1d95"><tspan font-weight="700">optional:</tspan> normal running</text>
  <text x="42" y="311" font-size="11.5" fill="#4c1d95"><tspan font-weight="700">required:</tspan> maintenance</text>
  <text x="42" y="335" font-size="11" fill="#5b21b6">holds no state · runs</text>
  <text x="42" y="351" font-size="11" fill="#5b21b6">outside the controller</text>

  <!-- Controller (system) -->
  <rect x="250" y="145" width="300" height="392" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <use href="#i-system" x="262" y="155" width="24" height="24" fill="#334155" color="#334155"/>
  <text x="294" y="173" font-size="16" font-weight="700" fill="#1e293b">Deck controller</text>
  <text x="264" y="194" font-size="10.5" font-weight="700" fill="#334155" letter-spacing=".5">NON-AGENT · NO AI REASONING INSIDE</text>

  <rect x="264" y="204" width="272" height="122" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="274" y="224" font-size="13" font-weight="700">Team preset = the campaign</text>
  <text x="274" y="242" font-size="11.5" fill="#57534e">description = outcome · Leader · scopes</text>
  <rect x="272" y="252" width="256" height="64" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="282" y="270" font-size="11.5" fill="#14532d" font-weight="700">+ parent_issue_url</text>
  <text x="282" y="287" font-size="11.5" fill="#14532d" font-weight="700">+ supervisor_actor_id (optional)</text>
  <text x="282" y="304" font-size="11.5" fill="#14532d" font-weight="700">+ next_check_at (optional)</text>

  <g font-size="12" text-anchor="middle">
    <rect x="264" y="338" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="329" y="357" font-weight="600">Dispatch · leases</text><text x="329" y="373" font-size="10.5" fill="#57534e">bounded attempts</text>
    <rect x="406" y="338" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="471" y="357" font-weight="600">Agent Mail</text><text x="471" y="373" font-size="10.5" fill="#57534e">authenticated</text>
    <rect x="264" y="390" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="329" y="409" font-weight="600">Human actions</text><text x="329" y="425" font-size="10.5" fill="#57534e">per preset</text>
    <rect x="406" y="390" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="471" y="409" font-weight="600">Work remaining</text><text x="471" y="425" font-size="10.5" fill="#57534e">per item</text>
    <rect x="264" y="442" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="329" y="461" font-weight="600">Audit · maint. ops</text><text x="329" y="477" font-size="10.5" fill="#57534e">replay-safe records</text>
    <rect x="406" y="442" width="130" height="44" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="471" y="461" font-weight="600">Attention signals</text><text x="471" y="477" font-size="9.5" fill="#57534e">stall·stop·review·HOLD</text>
  </g>
  <rect x="264" y="496" width="272" height="28" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="400" y="515" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">+ One summary card (planned)</text>

  <!-- Team (agents) -->
  <rect x="590" y="145" width="170" height="245" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <use href="#i-agent" x="600" y="155" width="24" height="24" fill="#6d28d9"/>
  <text x="630" y="173" font-size="16" font-weight="700" fill="#4c1d95">Team</text>
  <text x="602" y="194" font-size="10.5" font-weight="700" fill="#6d28d9" letter-spacing=".5">AI AGENTS</text>
  <g font-size="11">
    <rect x="602" y="204" width="146" height="42" rx="6" fill="#fff" stroke="#a78bfa"/>
    <use href="#i-agent" x="609" y="215" width="18" height="18" fill="#6d28d9"/>
    <text x="633" y="221" font-weight="700" font-size="12">Leader</text><text x="633" y="237" fill="#57534e">plans · approves</text>
    <rect x="608" y="258" width="146" height="42" rx="6" fill="#fff" stroke="#c4b5fd"/><rect x="605" y="255" width="146" height="42" rx="6" fill="#fff" stroke="#c4b5fd"/><rect x="602" y="252" width="146" height="42" rx="6" fill="#fff" stroke="#a78bfa"/>
    <use href="#i-agent" x="609" y="263" width="18" height="18" fill="#6d28d9"/>
    <text x="633" y="269" font-weight="700" font-size="11.5">Implementers ×N</text><text x="633" y="285" fill="#57534e">leased workspaces</text>
    <rect x="608" y="306" width="146" height="42" rx="6" fill="#fff" stroke="#c4b5fd"/><rect x="605" y="303" width="146" height="42" rx="6" fill="#fff" stroke="#c4b5fd"/><rect x="602" y="300" width="146" height="42" rx="6" fill="#fff" stroke="#a78bfa"/>
    <use href="#i-agent" x="609" y="311" width="18" height="18" fill="#6d28d9"/>
    <text x="633" y="317" font-weight="700" font-size="12">Verifiers ×N</text><text x="633" y="333" fill="#57534e">reviews exact SHA</text>
  </g>
  <text x="675" y="370" text-anchor="middle" font-size="10.5" fill="#78716c">size set by the Director</text>

  <!-- Grooming helper (agent, outside the factory, works for the Director) -->
  <rect x="790" y="146" width="160" height="94" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 3"/>
  <use href="#i-agent" x="799" y="154" width="20" height="20" fill="#6d28d9"/>
  <text x="824" y="169" font-size="13" font-weight="700" fill="#4c1d95">Grooming helper</text>
  <text x="800" y="189" font-size="10" font-weight="700" fill="#6d28d9" letter-spacing=".4">AI AGENT · OPTIONAL</text>
  <text x="800" y="206" font-size="11" fill="#4c1d95">drafts and splits issues;</text>
  <text x="800" y="222" font-size="11" fill="#4c1d95">the Director decides</text>
  <path d="M850,240 L850,266" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ma)" stroke-dasharray="5 3"/>
  <text x="856" y="258" font-size="10" fill="#4c1d95">drafts</text>
  <!-- GitHub (system, outside) -->
  <rect x="800" y="270" width="185" height="210" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <use href="#i-system" x="812" y="280" width="24" height="24" fill="#334155" color="#334155"/>
  <text x="844" y="298" font-size="16" font-weight="700" fill="#1e293b">GitHub</text>
  <text x="814" y="320" font-size="10.5" font-weight="700" fill="#334155" letter-spacing=".5">NON-AGENT SYSTEM</text>
  <text x="814" y="336" font-size="10.5" font-weight="700" fill="#334155" letter-spacing=".5">OUTSIDE THE FACTORY</text>
  <text x="814" y="360" font-size="12" fill="#1e293b"><tspan font-weight="700">Parent issue:</tspan></text>
  <text x="814" y="376" font-size="12" fill="#1e293b">delegation, status</text>
  <text x="814" y="398" font-size="12" fill="#1e293b"><tspan font-weight="700" fill="#b45309">Backlog</tspan> (Director-owned)</text>
  <text x="814" y="418" font-size="12" fill="#1e293b">PRs · required CI</text>
  <text x="814" y="446" font-size="11" fill="#57534e">supplies the work and</text>
  <text x="814" y="462" font-size="11" fill="#57534e">keeps the record</text>

  <!-- Arrows: human -->
  <path d="M500,74 L500,141" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#mh)"/>
  <text x="508" y="94" font-size="12" fill="#78350f">reads one card</text>
  <path d="M650,43 L968,43 L968,266" stroke="#b45309" stroke-width="2.6" fill="none" marker-end="url(#mh)"/>
  <text x="668" y="35" font-size="12" font-weight="700" fill="#78350f">owns + grooms the backlog · decides</text>
  <path d="M350,43 C200,43 115,90 115,176" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#mh)"/>
  <text x="150" y="40" text-anchor="end" font-size="12" fill="#78350f">delegates</text>
  <text x="150" y="55" text-anchor="end" font-size="11" fill="#78350f">(text in parent issue)</text>

  <!-- Arrows: agent -->
  <path d="M200,236 L246,236" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ma)" stroke-dasharray="6 3"/>
  <text x="201" y="228" font-size="9.5" fill="#4c1d95" font-weight="700">check-in</text>
  <path d="M200,300 L246,300" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ma)"/>
  <text x="204" y="318" font-size="10" fill="#4c1d95">operator</text>
  <text x="204" y="330" font-size="10" fill="#4c1d95">API</text>
  <path d="M115,370 L115,615 L892,615 L892,484" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ma)" stroke-dasharray="6 4"/>
  <text x="300" y="636" font-size="12" fill="#4c1d95">supervisor publishes checkpoints and maintenance status to the parent issue</text>
  <path d="M700,390 L700,410 L796,410" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ma)"/>
  <text x="706" y="404" font-size="10.5" fill="#4c1d95">PRs, pushes</text>

  <!-- Arrows: system -->
  <path d="M550,236 L586,236" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ms)" marker-start="url(#ms)"/>
  <text x="553" y="228" font-size="9.5" fill="#334155">Mail</text>
  <text x="553" y="252" font-size="9.5" fill="#334155">dispatch</text>
  <path d="M796,450 L554,450" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ms)"/>
  <text x="690" y="443" font-size="11" fill="#334155">controller polls</text>
</svg>
